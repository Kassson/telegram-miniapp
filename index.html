<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Группа 4-26СВ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- СТРАНИЦА ВХОДА -->
        <div id="authPage" class="page active">
            <div class="auth-container">
                <div class="auth-header">
                    <div class="auth-logo">📚</div>
                    <h1>Группа 4-26СВ</h1>
                    <p>Управление расписанием и ДЗ</p>
                </div>
                
                <div class="auth-buttons">
                    <button class="btn btn-primary btn-large" onclick="showCreateGroup()">
                        <span class="btn-icon">➕</span>
                        Создать группу
                    </button>
                    <button class="btn btn-outline btn-large" onclick="showJoinGroup()">
                        <span class="btn-icon">🔑</span>
                        Присоединиться к группе
                    </button>
                </div>
                
                <div class="auth-footer">
                    <p>Войдите в Telegram, чтобы продолжить</p>
                </div>
            </div>
        </div>

        <!-- МОДАЛЬНОЕ ОКНО ДЛЯ СОЗДАНИЯ ГРУППЫ -->
        <div class="modal" id="createGroupModal">
            <div class="modal-content">
                <button class="modal-close" onclick="closeModal('createGroupModal')">✕</button>
                <h3 class="modal-title">➕ Создать группу</h3>
                <div class="form-group">
                    <label>Название группы</label>
                    <input type="text" id="groupName" placeholder="Введите название группы" class="form-input">
                </div>
                <button class="btn btn-primary btn-full" onclick="createGroup()">Создать</button>
            </div>
        </div>

        <!-- МОДАЛЬНОЕ ОКНО ДЛЯ ПРИСОЕДИНЕНИЯ -->
        <div class="modal" id="joinGroupModal">
            <div class="modal-content">
                <button class="modal-close" onclick="closeModal('joinGroupModal')">✕</button>
                <h3 class="modal-title">🔑 Присоединиться к группе</h3>
                <div class="form-group">
                    <label>Код приглашения</label>
                    <input type="text" id="inviteCode" placeholder="Введите код приглашения" class="form-input">
                </div>
                <div class="form-group">
                    <label>Ваше полное имя</label>
                    <input type="text" id="userFullName" placeholder="Иванов Иван Иванович" class="form-input">
                </div>
                <button class="btn btn-primary btn-full" onclick="joinGroup()">Присоединиться</button>
            </div>
        </div>

        <!-- МОДАЛЬНОЕ ОКНО ДЛЯ КОДА ПРИГЛАШЕНИЯ -->
        <div class="modal" id="inviteCodeModal">
            <div class="modal-content">
                <button class="modal-close" onclick="closeModal('inviteCodeModal')">✕</button>
                <h3 class="modal-title">📋 Код приглашения</h3>
                <div class="invite-code-display" id="inviteCodeDisplay">ABC123</div>
                <p style="text-align:center;color:#666;margin-top:8px;">Отправьте этот код участникам</p>
                <button class="btn btn-primary btn-full" onclick="copyInviteCode()">📋 Скопировать</button>
            </div>
        </div>

        <!-- МОДАЛЬНОЕ ОКНО ДЛЯ РЕДАКТИРОВАНИЯ -->
        <div class="modal" id="editModal">
            <div class="modal-content">
                <button class="modal-close" onclick="closeModal('editModal')">✕</button>
                <div id="editModalContent"></div>
            </div>
        </div>

        <!-- ГЛАВНОЕ ПРИЛОЖЕНИЕ -->
        <div id="appPage" class="page">
            <!-- ХЕДЕР -->
            <header class="app-header">
                <div class="header-left">
                    <h1 id="groupNameDisplay">Группа</h1>
                    <span class="header-role" id="userRoleBadge">Участник</span>
                </div>
                <div class="header-right">
                    <button class="icon-btn" onclick="showSettings()">⚙️</button>
                </div>
            </header>

            <div class="header-user">
                <span class="user-name" id="userNameDisplay">Иванов Иван</span>
                <span class="user-nickname" id="userNicknameDisplay"></span>
            </div>

            <!-- ТАБЫ -->
            <div class="tabs">
                <button class="tab active" data-tab="today" onclick="switchTab('today')">
                    <span class="tab-icon">📅</span>
                    <span class="tab-label">Сегодня</span>
                </button>
                <button class="tab" data-tab="tomorrow" onclick="switchTab('tomorrow')">
                    <span class="tab-icon">🔮</span>
                    <span class="tab-label">Завтра</span>
                </button>
                <button class="tab" data-tab="week" onclick="switchTab('week')">
                    <span class="tab-icon">📆</span>
                    <span class="tab-label">Неделя</span>
                </button>
                <button class="tab" data-tab="homework" onclick="switchTab('homework')">
                    <span class="tab-icon">📝</span>
                    <span class="tab-label">ДЗ</span>
                </button>
                <button class="tab" data-tab="chat" onclick="switchTab('chat')">
                    <span class="tab-icon">💬</span>
                    <span class="tab-label">Чат</span>
                    <span class="tab-badge" id="chatBadge">0</span>
                </button>
                <button class="tab admin-tab" data-tab="admin" onclick="switchTab('admin')" id="adminTab" style="display:none">
                    <span class="tab-icon">⚙️</span>
                    <span class="tab-label">Админ</span>
                </button>
            </div>

            <!-- КОНТЕНТ ВКЛАДОК -->
            <div class="tab-content">
                <!-- СЕГОДНЯ -->
                <div id="tabToday" class="tab-panel active">
                    <div class="date-header">
                        <span class="date-label" id="todayDate">Сегодня</span>
                        <span class="date-weekday" id="todayWeekday">Понедельник</span>
                    </div>
                    <div id="todaySchedule"></div>
                </div>

                <!-- ЗАВТРА -->
                <div id="tabTomorrow" class="tab-panel">
                    <div class="date-header">
                        <span class="date-label" id="tomorrowDate">Завтра</span>
                        <span class="date-weekday" id="tomorrowWeekday">Вторник</span>
                    </div>
                    <div id="tomorrowSchedule"></div>
                </div>

                <!-- НЕДЕЛЯ -->
                <div id="tabWeek" class="tab-panel">
                    <div class="week-controls">
                        <button class="btn btn-sm btn-outline" onclick="changeWeek(-1)">◀</button>
                        <span class="week-label" id="weekLabel">Неделя</span>
                        <button class="btn btn-sm btn-outline" onclick="changeWeek(1)">▶</button>
                    </div>
                    <div id="weekSchedule"></div>
                </div>

                <!-- ДЗ -->
                <div id="tabHomework" class="tab-panel">
                    <div id="homeworkContent"></div>
                </div>

                <!-- ЧАТ -->
                <div id="tabChat" class="tab-panel">
                    <div class="chat-container">
                        <div class="chat-messages" id="chatMessages"></div>
                        <div class="chat-input">
                            <input type="text" id="chatInput" placeholder="Сообщение..." class="chat-input-field">
                            <button class="btn btn-primary btn-sm" onclick="sendMessage()">➤</button>
                        </div>
                    </div>
                </div>

                <!-- АДМИН -->
                <div id="tabAdmin" class="tab-panel">
                    <div id="adminContent"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- БИБЛИОТЕКИ -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="config.js"></script>
    <script src="chat.js"></script>
    <script src="admin.js"></script>
    <script src="app.js"></script>
</body>
</html>

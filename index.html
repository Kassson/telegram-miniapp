<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Workspaces</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- ЭКРАН РЕГИСТРАЦИИ -->
        <div id="registerPage" class="page active">
            <div class="register-container">
                <div class="register-header">
                    <div class="register-icon">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                            <path d="M2 17l10 5 10-5"/>
                            <path d="M2 12l10 5 10-5"/>
                        </svg>
                    </div>
                    <h1>Workspaces</h1>
                    <p>Введите ваши данные для входа</p>
                </div>

                <div class="register-form">
                    <div class="form-group">
                        <label>Имя</label>
                        <input type="text" id="regFirstName" class="form-input" placeholder="Иван">
                    </div>
                    <div class="form-group">
                        <label>Фамилия</label>
                        <input type="text" id="regLastName" class="form-input" placeholder="Иванов">
                    </div>
                    <div class="form-group">
                        <label>Telegram Nickname</label>
                        <input type="text" id="regNickname" class="form-input" placeholder="@username">
                    </div>
                    <button class="btn btn-primary btn-large" onclick="registerUser()">
                        Продолжить →
                    </button>
                </div>

                <div class="register-footer">
                    <button class="theme-toggle-small" onclick="toggleTheme()" id="themeToggleReg">🌙</button>
                    <span style="color: var(--text-secondary); font-size: 13px;">Сменить тему</span>
                </div>
            </div>
        </div>

        <!-- ЭКРАН ВЫБОРА ДЕЙСТВИЯ -->
        <div id="actionPage" class="page">
            <div class="action-container">
                <div class="action-header">
                    <div class="user-avatar" id="userAvatar">👤</div>
                    <h2 id="userDisplayName">Иван Иванов</h2>
                    <p class="user-tg" id="userDisplayNickname">@username</p>
                </div>

                <div class="action-buttons">
                    <button class="btn btn-primary btn-large" onclick="showCreateGroup()">
                        <span class="btn-icon">➕</span>
                        Создать пространство
                    </button>
                    <button class="btn btn-outline btn-large" onclick="showJoinGroup()">
                        <span class="btn-icon">🔑</span>
                        Присоединиться
                    </button>
                </div>

                <div class="action-footer">
                    <button class="theme-toggle-small" onclick="toggleTheme()" id="themeToggleAction">🌙</button>
                    <span style="color: var(--text-secondary); font-size: 13px;">Сменить тему</span>
                </div>
            </div>
        </div>

        <!-- МОДАЛЬНЫЕ ОКНА -->
        <div class="modal" id="createGroupModal">
            <div class="modal-content">
                <button class="modal-close" onclick="closeModal('createGroupModal')">✕</button>
                <h3 class="modal-title">Создать пространство</h3>
                <div class="form-group">
                    <label>Название</label>
                    <input type="text" id="groupName" placeholder="Введите название" class="form-input">
                </div>
                <button class="btn btn-primary btn-full" onclick="createGroup()">Создать</button>
            </div>
        </div>

        <div class="modal" id="joinGroupModal">
            <div class="modal-content">
                <button class="modal-close" onclick="closeModal('joinGroupModal')">✕</button>
                <h3 class="modal-title">Присоединиться</h3>
                <div class="form-group">
                    <label>Код приглашения</label>
                    <input type="text" id="inviteCode" placeholder="Введите код" class="form-input">
                </div>
                <button class="btn btn-primary btn-full" onclick="joinGroup()">Присоединиться</button>
            </div>
        </div>

        <div class="modal" id="inviteCodeModal">
            <div class="modal-content">
                <button class="modal-close" onclick="closeModal('inviteCodeModal')">✕</button>
                <h3 class="modal-title">Код приглашения</h3>
                <div class="invite-code-display" id="inviteCodeDisplay">ABC123</div>
                <button class="btn btn-primary btn-full" onclick="copyInviteCode()">📋 Скопировать</button>
            </div>
        </div>

        <div class="modal" id="editModal">
            <div class="modal-content">
                <button class="modal-close" onclick="closeModal('editModal')">✕</button>
                <div id="editModalContent"></div>
            </div>
        </div>

        <!-- ГЛАВНОЕ ПРИЛОЖЕНИЕ -->
        <div id="appPage" class="page">
            <header class="app-header">
                <div class="header-left">
                    <h1 id="groupNameDisplay">Workspaces</h1>
                    <span class="header-role" id="userRoleBadge">Участник</span>
                </div>
                <div class="header-right">
                    <button class="theme-toggle" onclick="toggleTheme()" id="themeToggleApp">🌙</button>
                </div>
            </header>

            <div class="header-user">
                <span class="user-name" id="userNameDisplay">Иванов Иван</span>
                <span class="user-nickname" id="userNicknameDisplay"></span>
                <span style="font-size:12px;color:var(--text-secondary);margin-left:8px;">
                    Код: <span id="inviteCodeDisplayHeader" style="font-weight:600;color:var(--accent);"></span>
                </span>
            </div>

            <div class="tabs">
                <button class="tab active" data-tab="today" onclick="switchTab('today')">
                    <span class="tab-icon">📅</span>
                    <span class="tab-label">Сегодня</span>
                </button>
                <button class="tab" data-tab="tomorrow" onclick="switchTab('tomorrow')">
                    <span class="tab-icon">🔮</span>
                    <span class="tab-label">Завтра</span>
                </button>
                <button class="tab" data-tab="week" onclick="switchTab('week')">
                    <span class="tab-icon">📆</span>
                    <span class="tab-label">Неделя</span>
                </button>
                <button class="tab" data-tab="homework" onclick="switchTab('homework')">
                    <span class="tab-icon">📝</span>
                    <span class="tab-label">ДЗ</span>
                </button>
                <button class="tab" data-tab="members" onclick="switchTab('members')">
                    <span class="tab-icon">👥</span>
                    <span class="tab-label">Участники</span>
                    <span class="tab-badge hidden" id="membersBadge">0</span>
                </button>
                <button class="tab" data-tab="chat" onclick="switchTab('chat')">
                    <span class="tab-icon">💬</span>
                    <span class="tab-label">Чат</span>
                    <span class="tab-badge hidden" id="chatBadge">0</span>
                </button>
                <button class="tab admin-tab" data-tab="admin" onclick="switchTab('admin')" id="adminTab" style="display:none">
                    <span class="tab-icon">⚙️</span>
                    <span class="tab-label">Админ</span>
                </button>
            </div>

            <div class="tab-content">
                <div id="tabToday" class="tab-panel active">
                    <div class="date-header">
                        <span class="date-label" id="todayDate">Сегодня</span>
                        <span class="date-weekday" id="todayWeekday">Понедельник</span>
                    </div>
                    <div id="todaySchedule"></div>
                </div>

                <div id="tabTomorrow" class="tab-panel">
                    <div class="date-header">
                        <span class="date-label" id="tomorrowDate">Завтра</span>
                        <span class="date-weekday" id="tomorrowWeekday">Вторник</span>
                    </div>
                    <div id="tomorrowSchedule"></div>
                </div>

                <div id="tabWeek" class="tab-panel">
                    <div class="week-controls">
                        <button class="btn btn-sm btn-outline" onclick="changeWeek(-1)">‹</button>
                        <span class="week-label" id="weekLabel">Текущая неделя</span>
                        <button class="btn btn-sm btn-outline" onclick="changeWeek(1)">›</button>
                    </div>
                    <div id="weekSchedule"></div>
                </div>

                <div id="tabHomework" class="tab-panel">
                    <div id="homeworkContent"></div>
                </div>

                <div id="tabMembers" class="tab-panel">
                    <div id="membersContent"></div>
                </div>

                <div id="tabChat" class="tab-panel">
                    <div class="chat-container">
                        <div class="chat-messages" id="chatMessages"></div>
                        <div class="chat-input">
                            <input type="text" id="chatInput" placeholder="Сообщение..." class="chat-input-field">
                            <button class="btn btn-primary btn-sm" onclick="sendMessage()">➤</button>
                        </div>
                    </div>
                </div>

                <div id="tabAdmin" class="tab-panel">
                    <div id="adminContent"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        window.Telegram = window.Telegram || {
            WebApp: {
                expand: function() { console.log('Telegram WebApp expanded (emulated)'); },
                initDataUnsafe: { user: { id: 123456789, first_name: 'Тест', last_name: 'Пользователь', username: 'testuser' } }
            }
        };
    </script>
    <script src="config.js"></script>
    <script src="app.js"></script>
    <script src="chat.js"></script>
    <script src="admin.js"></script>
</body>
</html>
